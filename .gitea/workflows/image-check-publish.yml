name: Docker Image CI

# No `pull_request` trigger here on purpose. This workflow pushes :latest, and
# watchtower on slug polls the registry every two minutes — a build off any PR
# branch would ship straight to asakusa-lab.cc. PRs are covered by tests.yml,
# which builds and smoke-tests but never logs in and never pushes.
on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

# No `packages: write` here: that scope is GitHub-specific and has no effect on Gitea
# Actions — the built-in GITEA_TOKEN carries no package scope at all. The registry push
# below authenticates with the REGISTRY_TOKEN PAT (an organisation-level secret on
# `projects`, inherited by this repo) instead.
permissions:
  contents: read   # checkout

# Two pushes to the same branch in a row must not race: the runs are independent
# and the older one may finish last, leaving its :latest on the registry — a
# watchtower deploy would then ship the previous commit to prod.
# The group alone already fixes that: runs are serialised, so the newest commit's
# :latest is written last. Cancelling is deliberately OFF — it would kill the
# older run together with its :<sha> image, and on two quick pushes the
# intermediate commit would never be built, leaving holes in the tag history
# exactly where a rollback is most likely to be needed.
concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Log in to the Gitea container registry
      uses: docker/login-action@v4
      with:
        registry: gitea.vvzvlad.xyz
        username: ${{ github.repository_owner }}
        # PAT with the `write:package` scope, stored as an organisation secret on
        # `projects` and inherited here. The built-in GITEA_TOKEN cannot be used —
        # it carries no package scope.
        password: ${{ secrets.REGISTRY_TOKEN }}

    - name: Compute image tags
      id: tags
      # main -> :latest + :<sha> (watchtower deploys :latest); ANY other branch -> :<branch>.
      # Only main is pushed to by the trigger above, but workflow_dispatch can be fired
      # off any ref, so the else branch still has to be correct.
      # Do NOT hardcode a fixed tag in the else branch: a build off a side branch would
      # then silently overwrite the tag production deploys from — one typo away from
      # shipping unreviewed code.
      env:
        # Passed through the environment instead of being interpolated into the
        # script text: git allows `$`, backticks, quotes and parentheses in branch
        # names, so a branch like `feat/$(id)` would otherwise execute on the runner.
        REF_NAME: ${{ github.ref_name }}
        REPO: ${{ github.repository }}
        SHA: ${{ github.sha }}
      run: |
        # Gitea allows uppercase letters in repository names, docker does not
        # accept them in an image path — a repo like `Asakusa_Lab` would fail the
        # build with `invalid reference format`, so lowercase it here.
        IMAGE="gitea.vvzvlad.xyz/$(printf '%s' "$REPO" | tr 'A-Z' 'a-z')"
        if [ "$REF_NAME" = "main" ]; then
          echo "tags=$IMAGE:latest $IMAGE:$SHA" >> "$GITHUB_OUTPUT"
          # The smoke gate needs ONE unambiguous tag out of the list above. The
          # :<sha> one is it — :latest is a moving target shared with whatever
          # ran before, :<sha> can only ever mean this commit's image.
          echo "smoke=$IMAGE:$SHA" >> "$GITHUB_OUTPUT"
        else
          # Sanitise the branch name into a legal docker tag: everything outside
          # [A-Za-z0-9_.-] (a `/` in feat/foo above all) becomes `-`, and the result
          # is cut to 100 chars — branch names have no length limit, docker rejects
          # tags over 128.
          # The `sed` fixes the first character: docker requires a tag to match
          # [a-zA-Z0-9_][a-zA-Z0-9._-]{0,127}, so a branch like `-fix`, `(test)`
          # or `+wip` would otherwise produce a leading `-` and fail the build
          # with `invalid reference format`.
          branch_tag=$(printf '%s' "$REF_NAME" | tr -c 'A-Za-z0-9_.-' '-' | sed 's/^[^A-Za-z0-9_]/_/' | cut -c1-100)
          echo "tags=$IMAGE:${branch_tag}" >> "$GITHUB_OUTPUT"
          echo "smoke=$IMAGE:${branch_tag}" >> "$GITHUB_OUTPUT"
        fi

    - name: Build the Docker image
      env:
        # Through the environment, not interpolated into the script text: the
        # only thing standing between a branch name and command execution on the
        # runner is the `tr` filter in the step above, and this step runs after
        # `docker login` with REGISTRY_TOKEN. `$TAGS` below is intentionally
        # unquoted — the tags are a space-separated list and word splitting is
        # exactly what turns it into loop items.
        TAGS: ${{ steps.tags.outputs.tags }}
      run: |
        tag_args=""
        for tag in $TAGS; do tag_args="$tag_args --tag $tag"; done
        # --pull is required here: unlike GitHub's ephemeral runners, cirunner-hatbox
        # is self-hosted with a persistent docker daemon, so a once-pulled base image
        # would sit in its cache for months and every build would inherit an
        # unpatched base layer.
        docker build --pull . --file Dockerfile $tag_args

    - name: Smoke-test the built image
      # There are no unit tests in this repo, so this is the only gate before
      # :latest goes live — watchtower on slug picks it up within two minutes.
      # Running inside the image checks the things a build alone cannot: that
      # the dependencies actually installed, that app.py imports, and that the
      # index route renders from the templates copied into the image.
      # It sits BETWEEN build and push on purpose: a red smoke means nothing
      # ever reaches the registry, so prod keeps serving the previous image.
      # No port publishing — the runner does not need to reach into the
      # container, Flask's own test client drives the app from the inside.
      env:
        SMOKE_TAG: ${{ steps.tags.outputs.smoke }}
      run: |
        docker run --rm --entrypoint python "$SMOKE_TAG" -c "
        import app
        client = app.app.test_client()
        response = client.get('/')
        assert response.status_code == 200, response.status_code
        print('smoke ok:', response.status_code)
        "

    - name: Push Docker images
      env:
        # Same reasoning as in the build step: pass the tags through the
        # environment, and leave `$TAGS` unquoted so it word-splits into items.
        TAGS: ${{ steps.tags.outputs.tags }}
      run: |
        for tag in $TAGS; do docker push "$tag"; done

    - name: Remove the built images from the runner
      # The runner's docker daemon is persistent, so the images built here would
      # otherwise pile up and grow the disk forever. This step removes ONLY the
      # tags this run created — no `docker system prune`, which would also wipe
      # images of other repos sharing the same daemon.
      # It does NOT reclaim everything: `docker rmi <tag>` never touches the
      # BuildKit cache (that lives in a separate builder store and is only freed
      # by `docker builder prune`), and `--pull` above leaves the previous base
      # image untagged as a dangling image whenever upstream updates it.
      # Both need a separate periodic cleanup on the runner host.
      # `always()` so the cleanup runs even when the smoke or the push above fails.
      if: always()
      env:
        # Same reasoning as in the build step: pass the tags through the
        # environment, and leave `$TAGS` unquoted so it word-splits into items.
        TAGS: ${{ steps.tags.outputs.tags }}
      run: |
        for tag in $TAGS; do docker rmi "$tag" || true; done
